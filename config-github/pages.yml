# Publica la carpeta src/ en GitHub Pages cada vez que subes cambios a main.
name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # Cambia la versión del service worker para que el teléfono baje lo nuevo.
      - run: sed -i "s/const VERSION = '[^']*'/const VERSION = 'rifas-${GITHUB_SHA::7}'/" src/sw.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: src
      # A veces GitHub todavía no "ve" el paquete recién subido y el primer intento falla.
      # Por eso se reintenta solo: espera y vuelve a publicar hasta 2 veces más.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90
      - id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
